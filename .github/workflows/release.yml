on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NOTE: pinned since this job can write to the repository and publishes to CTAN.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Check version
        id: version
        run: |
          VERSION=$(nix eval --raw .#ctan.version)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in flake.nix"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          nix build .#ctan --print-build-logs
          cp result string-diagrams-${{ steps.version.outputs.version }}.zip

      - name: "GitHub: release"
        uses: docker://antonyurchenko/git-release:v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: "${{ steps.version.outputs.version }}"
        with:
          args: |
            string-diagrams-${{ steps.version.outputs.version }}.zip

      - name: "CTAN: submit updated release"
        uses: paolobrasolin/ctan-submit-action@v1
        with:
          action: upload
          file_path: string-diagrams-${{ steps.version.outputs.version }}.zip
          fields: |
            update: "true"
            pkg: string-diagrams
            version: ${{ steps.version.outputs.version }}
            uploader: Paolo Brasolin
            email: paolo.brasolin@gmail.com
