on:
  push:
    branches-ignore:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check --print-build-logs
      - run: |
          nix build .#ctan --print-build-logs
          cp result string-diagrams-ctan.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ctan-${{ matrix.os }}
          path: string-diagrams-ctan.zip

  # NOTE: artifacts are platform independent, so they must be bit-for-bit identical across platforms.
  reproducibility:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          sha256sum ctan-*/string-diagrams-ctan.zip
          cmp ctan-ubuntu-latest/string-diagrams-ctan.zip ctan-macos-latest/string-diagrams-ctan.zip
