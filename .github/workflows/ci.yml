name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# NOTE: actions are pinned to commit SHAs, since tags can be moved to point at other code; Dependabot keeps the pins up to date.
jobs:
  build:
    strategy:
      matrix:
        # NOTE: release tags must build the same on every platform before they publish, and pull requests, mostly Dependabot's updates of TeX Live, are the likeliest to break that, so both build everywhere; ARM and macOS runners are slower or scarcer, so pushes to branches build on Intel Linux alone.
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request') && '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # NOTE: the Cachix step uploads what Nix builds, so CI builds each commit only once, although development, main and the release tag all run it. Pull requests from forks get no token, so they only download.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolobrasolin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake check --print-build-logs
      - run: |
          nix build .#ctan --print-build-logs
          cp result string-diagrams-ctan.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctan-${{ matrix.os }}
          path: string-diagrams-ctan.zip

  # NOTE: artifacts are platform independent, so they must be bit-for-bit identical across platforms.
  reproducibility:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - run: |
          sha256sum ctan-*/string-diagrams-ctan.zip
          for zip in ctan-*/string-diagrams-ctan.zip; do
            cmp ctan-ubuntu-latest/string-diagrams-ctan.zip "$zip"
          done

  # NOTE: the site follows the releases: it deploys when a release tag is pushed. A run by hand deploys it too, from a tag to redeploy that release, or from a branch to deploy its development version.
  site:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolobrasolin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # NOTE: the checkout already has a site directory, holding the sources, so the built site goes to _site.
      - run: |
          nix build .#site --print-build-logs
          cp -r --dereference result _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # NOTE: nothing is published unless CTAN validates the upload without warnings. After a failure the job can be rerun, but if the CTAN upload step itself failed, first check for CTAN's confirmation email: the upload may have gone through.
  # NOTE: only a pushed tag publishes, never a run by hand, which only deploys the site.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: reproducibility
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: paolobrasolin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check version and prepare release notes
        run: |
          VERSION=$(nix eval --raw .#ctan.version)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in flake.nix"
            exit 1
          fi
          awk -v version="$VERSION" '/^## \[/ || /^\[[^]]*\]: / { found = index($0, "## [" version "]") == 1; next } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no notes for version $VERSION"
            exit 1
          fi
          # NOTE: CTAN only announces major upgrades, so a summary before the first heading of the changelog entry opts in and becomes the (plain text) announcement.
          awk '/^### / { exit } { gsub("`", ""); print }' notes.md > announcement.txt
          if grep -q '[^[:space:]]' announcement.txt; then
            echo "CTAN will announce this release with the summary from CHANGELOG.md."
          else
            echo "No summary in CHANGELOG.md, so CTAN will not announce this release."
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ctan-ubuntu-latest

      # NOTE: l3build validates the upload, then asks whether to submit it. It fails on CTAN's warnings only after uploading, so they must fail here.
      - name: "CTAN: validate"
        run: |
          set -o pipefail
          echo n | nix develop --command l3build upload --file announcement.txt "$VERSION" | tee validation.log
          if grep -q "Warnings from CTAN" validation.log; then
            echo "CTAN reported warnings: fix them before publishing."
            exit 1
          fi

      - name: "GitHub: release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$VERSION" --notes-file notes.md
          cp string-diagrams-ctan.zip "string-diagrams-$VERSION.zip"
          gh release upload "$GITHUB_REF_NAME" "string-diagrams-$VERSION.zip" --clobber

      - name: "CTAN: upload"
        run: echo y | nix develop --command l3build upload --file announcement.txt "$VERSION"
