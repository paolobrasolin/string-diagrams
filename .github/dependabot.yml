version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # NOTE: a single monthly pull request for all actions.
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    # NOTE: a single monthly pull request for all flake inputs, whose CI runs the tests with the new TeX Live.
    groups:
      flake-inputs:
        patterns:
          - "*"
